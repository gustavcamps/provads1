<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - DS1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Editar Produto</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome do Produto</label>
                    <input type="text" name="nome_produto" class="form-control" value="{{ produto.nome_produto }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Preço (R$)</label>
                    <input type="text" name="preco" class="form-control" value="{{ produto.preco }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Categoria</label>
                    <select name="id_categoria" class="form-select" required>
                        {% for cat in categorias %}
                            <option value="{{ cat.id_categoria }}" {% if cat.id_categoria == produto.id_categoria %}selected{% endif %}>
                                {{ cat.nome_categoria }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nova Foto (opcional)</label>
                    <input type="file" name="foto" class="form-control" accept=".png,.jpg,.jpeg,.gif,.webp">
                    <div class="form-text">Deixe em branco para manter a imagem atual.</div>
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <div>
                        <span class="d-block text-muted small mb-1">Imagem Atual:</span>
                        <img src="{{ url_for('static', filename='uploads/' + produto.foto) }}" width="80" height="80" class="rounded border object-fit-cover">
                    </div>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
